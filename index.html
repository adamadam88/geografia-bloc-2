<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geografia d'Espanya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Disseny: mapa a l'esquerra, fitxa de la unitat a la dreta; colors de mapa fixos per unitat, interfície neutra amb accent blau. */
  :root {
    --bg: #F2F5F7;
    --surface: #FFFFFF;
    --ink: #15212B;
    --ink2: #4F5F6C;
    --line: #D3DBE1;
    --sea: #D4E5F1;
    --land: #EDF0E6;
    --pt: #E0E3D6;
    --fr: #E6E9E5;
    --edge: #8E9C95;
    --accent: #1D5FA8;
    --accent-ink: #FFFFFF;
    --ok: #1E7F4F;
    --bad: #C23B2E;
    --halo: rgba(255, 255, 255, .88);
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F161C; --surface: #17212A; --ink: #E8EEF2; --ink2: #9FB0BC; --line: #2A3844;
      --sea: #13273A; --land: #26322A; --pt: #1F2B24; --fr: #1E292E; --edge: #4C5C54;
      --accent: #6FA8E8; --accent-ink: #0B1722; --ok: #5CC38A; --bad: #F07A6C; --halo: rgba(15, 22, 28, .82);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F161C; --surface: #17212A; --ink: #E8EEF2; --ink2: #9FB0BC; --line: #2A3844;
    --sea: #13273A; --land: #26322A; --pt: #1F2B24; --fr: #1E292E; --edge: #4C5C54;
    --accent: #6FA8E8; --accent-ink: #0B1722; --ok: #5CC38A; --bad: #F07A6C; --halo: rgba(15, 22, 28, .82);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5;
    padding-block: 16px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: clamp(24px, 4vw, 32px); font-weight: 700; letter-spacing: -.01em; line-height: 1.1; text-wrap: balance; }
  .sub { margin: 4px 0 0; color: var(--ink2); font-size: 14px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 8px 16px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink2); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink2);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); }
  .chip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chip .tick { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--edge); flex: none; display: inline-grid; place-items: center; font-size: 10px; line-height: 1; color: var(--accent-ink); }
  .chip[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); }

  .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .mapcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; min-width: 0; }
  #map, #tmap { overflow-x: auto; border-radius: 8px; }
  #map svg, #tmap svg { display: block; width: 100%; height: auto; border-radius: 8px; touch-action: manipulation; }
  @media (max-width: 640px) { #map svg, #tmap svg { width: 680px; max-width: none; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

  /* mapa */
  .sea { fill: var(--sea); }
  .land { fill: var(--land); stroke: var(--edge); stroke-width: 1.2; stroke-linejoin: round; }
  .pt { fill: var(--pt); stroke: none; }
  .fr { fill: var(--fr); stroke: var(--edge); stroke-width: 1.2; stroke-linejoin: round; }
  .border { fill: none; stroke: var(--edge); stroke-width: 1.2; stroke-dasharray: 5 3; }
  .unit { cursor: pointer; transition: opacity .2s; }
  .unit .shape { transition: opacity .2s; }
  .unit .hit { fill: none; stroke: transparent; pointer-events: stroke; }
  .unit .hitfill { fill: transparent; pointer-events: all; }
  svg.has-sel .unit:not(.sel):not(.ok):not(.bad) { opacity: .28; }
  .unit.sel .shape { filter: drop-shadow(0 0 5px rgba(0, 0, 0, .35)); }
  .unit.ok .shape { stroke: var(--ok); }
  .unit.bad .shape { stroke: var(--bad); }
  .unit.ok .area, .unit.bad .area { stroke-width: 4; }
  .lab { font-family: var(--sans); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
  .lab.sm { font-weight: 600; }
  .lab.big { font-weight: 600; letter-spacing: .18em; opacity: .75; }
  svg.hide-names .lab, svg.quiz .lab { display: none; }
  svg.quiz .lab.show { display: block; }
  .ref { font-family: var(--sans); font-size: 12px; fill: var(--ink2); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; pointer-events: none; }
  .ref.cap { font-size: 12px; letter-spacing: .14em; font-weight: 600; text-anchor: middle; opacity: .8; }
  .ref.sea-t { font-style: italic; letter-spacing: .12em; fill: var(--ink2); opacity: .8; }
  .city { fill: var(--ink); }
  svg.hide-refs .refs { display: none; }
  .peak { display: none; pointer-events: none; }
  .peak.on { display: block; }
  .peak path { fill: var(--ink); stroke: var(--halo); stroke-width: 1.5; }
  .peak text { font-family: var(--mono); font-size: 12px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3.5px; }
  .gl { fill: none; stroke: var(--edge); stroke-width: 1; opacity: .55; }
  .gt { font-family: var(--mono); font-size: 12px; fill: var(--ink2); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; pointer-events: none; }
  svg.hide-grid .grat, svg.hide-grid .gtx { display: none; }
  .mark { fill: none; stroke: var(--ink); stroke-width: 3; }
  .mark-in { fill: var(--ink); }

  /* panel */
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
  .name { display: flex; align-items: center; gap: 10px; margin: 2px 0 0; }
  .name .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
  dl { margin: 0; display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 10px 14px; font-size: 14px; }
  dt { color: var(--ink2); font-weight: 500; }
  dd { margin: 0; }
  details { font-size: 13px; color: var(--ink2); }
  summary { cursor: pointer; font-weight: 600; color: var(--ink); padding: 2px 0; }
  .pts { margin: 8px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-family: var(--mono); font-size: 12px; }
  dd.num { font-family: var(--mono); font-size: 13px; }
  .hint { color: var(--ink2); font-size: 14px; margin: 0; }
  .legend-title { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 0 0 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .rule { border: 0; border-top: 1px solid var(--line); margin: 0; }

  .ask { font-size: 13px; font-weight: 600; color: var(--ink2); letter-spacing: .06em; text-transform: uppercase; margin: 0; }
  .target { font-size: clamp(24px, 4.2vw, 30px); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
  .prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink2); }
  .bar { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 440px) { .opts { grid-template-columns: minmax(0, 1fr); } }
  .opt { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 14px; min-height: 48px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .opt.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
  .opt:disabled { cursor: default; }
  .fb { border-radius: 10px; padding: 12px 14px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); }
  .fb.ok { border-color: var(--ok); }
  .fb.bad { border-color: var(--bad); }
  .fb b { display: block; font-size: 15px; margin-bottom: 2px; }
  .btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 11px 18px; border-radius: 10px; font-size: 14px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .score { font-family: var(--mono); font-size: 40px; font-weight: 500; line-height: 1; }
  .miss { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .miss li { display: flex; align-items: center; gap: 8px; }
  .miss .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .note { font-size: 13px; color: var(--ink2); margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  [hidden] { display: none !important; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; align-self: flex-start; }
  .tabs button { white-space: nowrap; }
  .seam { pointer-events: none; }
  .outline { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; stroke-opacity: .75; pointer-events: none; }
  .unit.sel .outline { stroke-width: 3; stroke-opacity: 1; }
  .unit.ok .outline { stroke: var(--ok); stroke-width: 3.5; stroke-opacity: 1; }
  .unit.bad .outline { stroke: var(--bad); stroke-width: 3.5; stroke-opacity: 1; }
  .tsh { stroke: var(--edge); stroke-width: .9; stroke-linejoin: round; }
  .unit.sel .tsh { stroke: var(--ink); stroke-width: 2.4; }
  .unit.ok .tsh { stroke-width: 3; }
  .lab.tiny { display: none; }
  .lab.tiny.show { display: block; }
  svg.hide-names .lab.show { display: block; }
  .inset { fill: none; stroke: var(--edge); stroke-width: 1.2; stroke-dasharray: 5 3; pointer-events: none; }
  .cdot { fill: var(--ink); stroke: var(--halo); stroke-width: 1.5; pointer-events: none; }
  .capg { display: none; pointer-events: none; }
  svg.show-caps .capg, .capg.sel { display: block; }
  svg.quiz .capg { display: none; }
  .capt { font-weight: 600; fill: var(--ink); }
  .hland { fill: var(--land); stroke: var(--edge); stroke-width: .6; stroke-opacity: .4; stroke-linejoin: round; }
  .hlead { display: none; pointer-events: none; opacity: .8; }
  .hlead.show { display: block; }
  #hsvg .unit .hline { transition: opacity .2s; }
  #hsvg .hhit { pointer-events: stroke; }
  #hsvg circle.hhit { pointer-events: all; }
  #hsvg .lab { font-size: 12.5px; }
  #hsvg .unit.sel .hline { filter: drop-shadow(0 0 4px rgba(0,0,0,.4)); stroke-width: 7; }
  #hsvg .unit.ok .hline, #hsvg .unit.bad .hline { stroke-width: 8; }
  #hsvg .unit.ok .hline { stroke: var(--ok); } #hsvg .unit.bad .hline { stroke: var(--bad); }
  #hsvg .unit.ok path[fill]:not([fill="none"]) { fill: var(--ok); } #hsvg .unit.bad path[fill]:not([fill="none"]) { fill: var(--bad); }
html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
</style>

<style>#gate{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}#gate form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;font-family:var(--sans);color:var(--ink)}#gate h1{margin:0;font-size:22px}#gate p{margin:0;font-size:14px;color:var(--ink2)}#gate input{font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-transform:uppercase;letter-spacing:.1em}#gate button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}#gate .err{color:var(--bad);min-height:1.2em}body.locked>main{display:none}</style>
</head>
<body>
<div id="gate"><form id="gform"><h1>Geografia d'Espanya</h1><p>Escriu el codi d'accés que t'han donat.</p><input id="gcode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Codi d'accés"><div class="err" id="gerr" role="alert"></div><button type="submit">Entrar</button></form></div>
<script>
(function(){
  function H(s){var a=0xdeadbeef,b=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677);}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);return (a>>>0).toString(36);}
  var OK="1redh4m", K="geo-gate-v1", g=document.getElementById("gate");
  function open(){g.style.display="none";document.body.classList.remove("locked");}
  document.body.classList.add("locked");
  try{ if(localStorage.getItem(K)===OK){open();return;} }catch(e){}
  document.getElementById("gform").addEventListener("submit",function(e){
    e.preventDefault();
    var v=document.getElementById("gcode").value.trim().toUpperCase();
    if(H(v)===OK){ try{localStorage.setItem(K,OK);}catch(x){} open(); }
    else document.getElementById("gerr").textContent="Codi incorrecte.";
  });
})();
</script>

  <nav class="seg tabs" id="tabs" aria-label="Apartat">

  <div id="view-relief" class="app" style="max-width:none;margin:0">

      <button type="button" id="hm-locate" aria-pressed="false">Localitza</button>
      <button type="button" id="hm-name" aria-pressed="false">Anomena</button>
      <button type="button" id="hm-qa" aria-pressed="false">Dades</button>

<script>
(function () {
  "use strict";

  /* ---------- Projecció (equirectangular escalada, prou bona per a la península) ---------- */
  var W = 1000, H = 715.6;
  var LON0 = -4.0046, PH1 = 33.382, PH2 = 44.231, XMIN = -0.091898, YMAX = 0.080523, SC = 4532.99, RAD = Math.PI / 180;
  var NN = Math.log(Math.cos(PH1 * RAD) / Math.cos(PH2 * RAD)) / Math.log(Math.tan(Math.PI / 4 + PH2 * RAD / 2) / Math.tan(Math.PI / 4 + PH1 * RAD / 2));
  var FF = Math.cos(PH1 * RAD) * Math.pow(Math.tan(Math.PI / 4 + PH1 * RAD / 2), NN) / NN;
  function rho(lat) { return FF / Math.pow(Math.tan(Math.PI / 4 + lat * RAD / 2), NN); }
  var RHO0 = rho(40);
  /* Cònica conforme de Lambert: la mateixa projecció que el mapa de paper (meridians que convergeixen cap al nord) */
  function P(ll) {
    var r = rho(ll[1]), th = NN * (ll[0] - LON0) * RAD;
    return [(r * Math.sin(th) - XMIN) * SC, (YMAX - (RHO0 - r * Math.cos(th))) * SC];
  }
  function f(n) { return n.toFixed(1); }
  function pt(p) { var q = P(p); return f(q[0]) + "," + f(q[1]); }
  function poly(a) { return "M" + a.map(pt).join("L") + "Z"; }
  function open(a) { return "M" + a.map(pt).join("L"); }
  function curve(a) {
    var q = a.map(P), n = q.length, d = "M" + f(q[0][0]) + "," + f(q[0][1]);
    if (n < 3) return d + "L" + f(q[n - 1][0]) + "," + f(q[n - 1][1]);
    for (var i = 1; i < n - 1; i++) {
      var ex = i === n - 2 ? q[n - 1][0] : (q[i][0] + q[i + 1][0]) / 2;
      var ey = i === n - 2 ? q[n - 1][1] : (q[i][1] + q[i + 1][1]) / 2;
      d += "Q" + f(q[i][0]) + "," + f(q[i][1]) + " " + f(ex) + "," + f(ey);
    }
    return d;

      panel.appendChild(h("p", { "class": "ask", text: "Toca al mapa" }));
      panel.appendChild(h("p", { "class": "target", text: u.n }));
      if (!R.answered) panel.appendChild(h("p", { "class": "hint", text: "Toca sobre la serralada, l'altiplà o la depressió. Les serralades són franges estretes: toca'n el centre." }));

      panel.appendChild(h("p", { "class": "ask", text: "Quina unitat està ressaltada?" }));
      if (!R.opts) R.opts = {};

      var opts = h("div", { "class": "opts" }, R.opts[id].list.map(function (oid) {

          if (oid === id) b.classList.add("ok");

    var rest = ORDER.filter(function (i) { return i !== id && same.indexOf(i) < 0; });

      var ok = id === target;

      if (!ok && id) mapMark(id, "bad");

    panel.appendChild(h("p", { "class": "target", text: u.n }));
    showAnswerFeedback(u);
  }
  function answerName(oid) {
    if (R.answered) return;
    var id = R.queue[R.i], ok = oid === id;

})();
