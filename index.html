<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geografia · Bloc 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Disseny: mapa a l'esquerra, fitxa de la unitat a la dreta; colors de mapa fixos per unitat, interfície neutra amb accent blau. */
  :root {
    --bg: #F2F5F7;
    --surface: #FFFFFF;
    --ink: #15212B;
    --ink2: #4F5F6C;
    --line: #D3DBE1;
    --sea: #D4E5F1;
    --land: #EDF0E6;
    --pt: #E0E3D6;
    --fr: #E6E9E5;
    --edge: #8E9C95;
    --accent: #1D5FA8;
    --accent-ink: #FFFFFF;
    --ok: #1E7F4F;
    --bad: #C23B2E;
    --halo: rgba(255, 255, 255, .88);
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F161C; --surface: #17212A; --ink: #E8EEF2; --ink2: #9FB0BC; --line: #2A3844;
      --sea: #13273A; --land: #26322A; --pt: #1F2B24; --fr: #1E292E; --edge: #4C5C54;
      --accent: #6FA8E8; --accent-ink: #0B1722; --ok: #5CC38A; --bad: #F07A6C; --halo: rgba(15, 22, 28, .82);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F161C; --surface: #17212A; --ink: #E8EEF2; --ink2: #9FB0BC; --line: #2A3844;
    --sea: #13273A; --land: #26322A; --pt: #1F2B24; --fr: #1E292E; --edge: #4C5C54;
    --accent: #6FA8E8; --accent-ink: #0B1722; --ok: #5CC38A; --bad: #F07A6C; --halo: rgba(15, 22, 28, .82);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5;
    padding-block: 16px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: clamp(24px, 4vw, 32px); font-weight: 700; letter-spacing: -.01em; line-height: 1.1; text-wrap: balance; }
  .sub { margin: 4px 0 0; color: var(--ink2); font-size: 14px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 8px 16px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink2); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink2);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); }
  .chip .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .chip .tick { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--edge); flex: none; display: inline-grid; place-items: center; font-size: 10px; line-height: 1; color: var(--accent-ink); }
  .chip[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); }

  .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .mapcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; min-width: 0; }
  #map, #tmap { overflow-x: auto; border-radius: 8px; }
  #map svg, #tmap svg { display: block; width: 100%; height: auto; border-radius: 8px; touch-action: manipulation; }
  @media (max-width: 640px) { #map svg, #tmap svg { width: 680px; max-width: none; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

  /* mapa */
  .sea { fill: var(--sea); }
  .land { fill: var(--land); stroke: var(--edge); stroke-width: 1.2; stroke-linejoin: round; }
  .pt { fill: var(--pt); stroke: none; }
  .fr { fill: var(--fr); stroke: var(--edge); stroke-width: 1.2; stroke-linejoin: round; }
  .border { fill: none; stroke: var(--edge); stroke-width: 1.2; stroke-dasharray: 5 3; }
  .unit { cursor: pointer; transition: opacity .2s; }
  .unit .shape { transition: opacity .2s; }
  .unit .hit { fill: none; stroke: transparent; pointer-events: stroke; }
  .unit .hitfill { fill: transparent; pointer-events: all; }
  svg.has-sel .unit:not(.sel):not(.ok):not(.bad) { opacity: .28; }
  .unit.sel .shape { filter: drop-shadow(0 0 5px rgba(0, 0, 0, .35)); }
  .unit.ok .shape { stroke: var(--ok); }
  .unit.bad .shape { stroke: var(--bad); }
  .unit.ok .area, .unit.bad .area { stroke-width: 4; }
  .lab { font-family: var(--sans); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
  .lab.sm { font-weight: 600; }
  .lab.big { font-weight: 600; letter-spacing: .18em; opacity: .75; }
  svg.hide-names .lab, svg.quiz .lab { display: none; }
  svg.quiz .lab.show { display: block; }
  .ref { font-family: var(--sans); font-size: 12px; fill: var(--ink2); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; pointer-events: none; }
  .ref.cap { font-size: 12px; letter-spacing: .14em; font-weight: 600; text-anchor: middle; opacity: .8; }
  .ref.sea-t { font-style: italic; letter-spacing: .12em; fill: var(--ink2); opacity: .8; }
  .city { fill: var(--ink); }
  svg.hide-refs .refs { display: none; }
  .peak { display: none; pointer-events: none; }
  .peak.on { display: block; }
  .peak path { fill: var(--ink); stroke: var(--halo); stroke-width: 1.5; }
  .peak text { font-family: var(--mono); font-size: 12px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3.5px; }
  .gl { fill: none; stroke: var(--edge); stroke-width: 1; opacity: .55; }
  .gt { font-family: var(--mono); font-size: 12px; fill: var(--ink2); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; pointer-events: none; }
  svg.hide-grid .grat, svg.hide-grid .gtx { display: none; }
  .mark { fill: none; stroke: var(--ink); stroke-width: 3; }
  .mark-in { fill: var(--ink); }

  /* panel */
  .kicker { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
  .name { display: flex; align-items: center; gap: 10px; margin: 2px 0 0; }
  .name .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
  h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
  dl { margin: 0; display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 10px 14px; font-size: 14px; }
  dt { color: var(--ink2); font-weight: 500; }
  dd { margin: 0; }
  details { font-size: 13px; color: var(--ink2); }
  summary { cursor: pointer; font-weight: 600; color: var(--ink); padding: 2px 0; }
  .pts { margin: 8px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-family: var(--mono); font-size: 12px; }
  dd.num { font-family: var(--mono); font-size: 13px; }
  .hint { color: var(--ink2); font-size: 14px; margin: 0; }
  .legend-title { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 0 0 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .rule { border: 0; border-top: 1px solid var(--line); margin: 0; }

  .ask { font-size: 13px; font-weight: 600; color: var(--ink2); letter-spacing: .06em; text-transform: uppercase; margin: 0; }
  .target { font-size: clamp(24px, 4.2vw, 30px); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
  .prog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink2); }
  .bar { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 440px) { .opts { grid-template-columns: minmax(0, 1fr); } }
  .opt { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 14px; min-height: 48px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
  .opt.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
  .opt:disabled { cursor: default; }
  .fb { border-radius: 10px; padding: 12px 14px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); }
  .fb.ok { border-color: var(--ok); }
  .fb.bad { border-color: var(--bad); }
  .fb b { display: block; font-size: 15px; margin-bottom: 2px; }
  .btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 11px 18px; border-radius: 10px; font-size: 14px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .score { font-family: var(--mono); font-size: 40px; font-weight: 500; line-height: 1; }
  .miss { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .miss li { display: flex; align-items: center; gap: 8px; }
  .miss .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .note { font-size: 13px; color: var(--ink2); margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  [hidden] { display: none !important; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; align-self: flex-start; }
  .tabs button { white-space: nowrap; }
  .seam { pointer-events: none; }
  .outline { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; stroke-opacity: .75; pointer-events: none; }
  .unit.sel .outline { stroke-width: 3; stroke-opacity: 1; }
  .unit.ok .outline { stroke: var(--ok); stroke-width: 3.5; stroke-opacity: 1; }
  .unit.bad .outline { stroke: var(--bad); stroke-width: 3.5; stroke-opacity: 1; }
  .tsh { stroke: var(--edge); stroke-width: .9; stroke-linejoin: round; }
  .unit.sel .tsh { stroke: var(--ink); stroke-width: 2.4; }
  .unit.ok .tsh { stroke-width: 3; }
  .lab.tiny { display: none; }
  .lab.tiny.show { display: block; }
  svg.hide-names .lab.show { display: block; }
  .inset { fill: none; stroke: var(--edge); stroke-width: 1.2; stroke-dasharray: 5 3; pointer-events: none; }
  .cdot { fill: var(--ink); stroke: var(--halo); stroke-width: 1.5; pointer-events: none; }
  .capg { display: none; pointer-events: none; }
  svg.show-caps .capg, .capg.sel { display: block; }
  svg.quiz .capg { display: none; }
  .capt { font-weight: 600; fill: var(--ink); }
  .hland { fill: var(--land); stroke: var(--edge); stroke-width: .6; stroke-opacity: .4; stroke-linejoin: round; }
  .hlead { display: none; pointer-events: none; opacity: .8; }
  .hlead.show { display: block; }
  #hsvg .unit .hline { transition: opacity .2s; }
  #hsvg .hhit { pointer-events: stroke; }
  #hsvg circle.hhit { pointer-events: all; }
  #hsvg .lab { font-size: 12.5px; }
  #hsvg .unit.sel .hline { filter: drop-shadow(0 0 4px rgba(0,0,0,.4)); stroke-width: 7; }
  #hsvg .unit.ok .hline, #hsvg .unit.bad .hline { stroke-width: 8; }
  #hsvg .unit.ok .hline { stroke: var(--ok); } #hsvg .unit.bad .hline { stroke: var(--bad); }
  #hsvg .unit.ok path[fill]:not([fill="none"]) { fill: var(--ok); } #hsvg .unit.bad path[fill]:not([fill="none"]) { fill: var(--bad); }
html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--sans)}

  /* ===== Temari (Bloc 2, temes 1-3) ===== */
  #sec { align-self: flex-start; }
  #sec button { padding: 9px 20px; }
  .st { display: flex; flex-direction: column; gap: 14px; }
  .st h3 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
  .st h4 { margin: 0; font-size: 15px; font-weight: 700; }
  .st p { margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .muted { color: var(--ink2); font-size: 14px; }
  .big-n { font-family: var(--mono); font-size: 30px; font-weight: 500; line-height: 1; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
  .stat .btn { align-self: flex-start; margin-top: 4px; }
  .mlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .mlist li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
  .mlist .ic { width: 28px; height: 28px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .sess { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
  .sess:first-of-type { border-top: 0; }
  .chk { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--edge); background: var(--surface); display: grid; place-items: center; padding: 0; font-size: 15px; color: var(--accent-ink); }
  .chk[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
  .sess.done h4 { text-decoration: line-through; color: var(--ink2); }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .lk { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 600; color: var(--accent); }
  .lk:hover { border-color: var(--accent); }

  /* Explicat */
  .toc { display: flex; flex-wrap: wrap; gap: 6px; }
  .toc a { font-size: 13px; text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 9px; }
  .toc a.read { border-color: var(--ok); }
  .toc a.read::before { content: "✓ "; color: var(--ok); font-weight: 700; }
  .sec-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .pp { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 15.5px; line-height: 1.6; }
  .pp .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 8px; }
  .pp.e .dot { background: #C99A2E; }
  .pp.i .dot { border: 2px solid #C99A2E; }
  .pp.d .dot, .pp.a .dot { background: var(--line); }
  .pp.c, .pp.n, .pp.a { border-radius: 10px; padding: 10px 12px; grid-template-columns: minmax(0, 1fr); font-size: 14.5px; }
  .pp.c { background: color-mix(in srgb, #E0A21B 15%, var(--surface)); border: 1px solid color-mix(in srgb, #E0A21B 45%, var(--surface)); }
  .pp.n { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--surface)); }
  .pp.a { background: var(--bg); border: 1px dashed var(--edge); }
  .pp.c .dot, .pp.n .dot, .pp.a .dot { display: none; }
  .recall { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .rq { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; text-align: left; font-size: 14px; width: 100%; }
  .rq b { display: block; }
  .rq .ans { display: none; margin-top: 6px; color: var(--ink2); }
  .rq.open .ans { display: block; }
  .rq .hint2 { font-size: 12px; color: var(--accent); font-weight: 600; }
  .rq.open .hint2 { display: none; }
  .legend-lv { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink2); align-items: center; }
  .legend-lv span { display: inline-flex; align-items: center; gap: 6px; }
  .legend-lv i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  /* Esquemes */
  .tl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; position: relative; padding-top: 26px; }
  .tl::before { content: ""; position: absolute; left: 4%; right: 4%; top: 11px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, #7C5CAD, #3D8BC9, #C2453A, #4FA261); }
  .tl .nd { position: relative; padding: 0 8px; display: flex; flex-direction: column; gap: 6px; }
  .tl .nd::before { content: ""; position: absolute; top: -21px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--surface); border: 4px solid var(--c); }
  .tl .era { font-weight: 700; text-align: center; color: var(--c); }
  .tl .when { font-family: var(--mono); font-size: 12px; text-align: center; color: var(--ink2); }
  .tl .box { border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 10px; padding: 10px; font-size: 13.5px; background: var(--bg); flex: 1; }
  @media (max-width: 720px) { .tl { grid-template-columns: minmax(0, 1fr); padding-top: 0; padding-left: 26px; gap: 14px; } .tl::before { left: 9px; right: auto; top: 4px; bottom: 4px; width: 4px; height: auto; background: linear-gradient(180deg, #7C5CAD, #3D8BC9, #C2453A, #4FA261); } .tl .nd::before { top: 2px; left: -24px; margin-left: 0; } .tl .era, .tl .when { text-align: left; } }
  .clau { display: grid; grid-template-columns: auto 22px minmax(0, 1fr); align-items: center; gap: 0 10px; }
  .clau > .root { font-weight: 700; font-size: 16px; padding: 10px 12px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); text-align: center; max-width: 140px; }
  .clau > .br { align-self: stretch; position: relative; }
  .clau > .br::before { content: ""; position: absolute; inset: 4px 0 4px 8px; border: 3px solid var(--edge); border-right: 0; border-radius: 14px 0 0 14px; }
  .clau > .br::after { content: ""; position: absolute; left: 0; top: 50%; width: 10px; height: 3px; background: var(--edge); }
  .clau > .kids { display: flex; flex-direction: column; gap: 8px; }
  .clau .kid { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent)); border-radius: 8px; padding: 8px 10px; background: var(--bg); font-size: 13.5px; }
  .clau .kid b { font-size: 14px; }
  .clau.sub > .root { background: var(--bg); color: var(--ink); border: 1px solid var(--line); font-size: 14px; }
  .clau .kid.nest { padding: 8px; }
  .rastell { display: flex; flex-direction: column; }
  .rastell .bar { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 10px 14px; border-radius: 10px 10px 0 0; text-align: center; }
  .rastell .teeth { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .rastell .tooth { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; padding: 12px; background: var(--bg); position: relative; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
  .rastell .tooth::before { content: ""; position: absolute; top: 0; left: 50%; width: 4px; height: 12px; margin-left: -2px; background: var(--accent); }

      panel.appendChild(h("p", { "class": "ask", text: "Toca al mapa" }));
      panel.appendChild(h("p", { "class": "target", text: u.n }));
      if (!R.answered) panel.appendChild(h("p", { "class": "hint", text: "Toca sobre la serralada, l'altiplà o la depressió. Les serralades són franges estretes: toca'n el centre." }));

      panel.appendChild(h("p", { "class": "ask", text: "Quina unitat està ressaltada?" }));
      if (!R.opts) R.opts = {};

      var opts = h("div", { "class": "opts" }, R.opts[id].list.map(function (oid) {

          if (oid === id) b.classList.add("ok");

    var rest = ORDER.filter(function (i) { return i !== id && same.indexOf(i) < 0; });

      var ok = id === target;

      if (!ok && id) mapMark(id, "bad");

    panel.appendChild(h("p", { "class": "target", text: u.n }));
    showAnswerFeedback(u);
  }
  function answerName(oid) {
    if (R.answered) return;
    var id = R.queue[R.i], ok = oid === id;

})();

  ["d", "Coordenades extremes de la península: al nord, l'Estaca de Bares (43° 47' N); al sud, la Punta de Tarifa (36° 00' N); a l'est, el cap de Creus (3° 19' E); i a l'oest, el cap Touriñán (9° 17' O)."]
 ], rq: [["Quins són els tres trets fonamentals del relleu peninsular?", "Un gran altiplà central (Meseta) envoltat de serralades, dues grans depressions (Ebre i Guadalquivir) i una altitud mitjana elevada (660 m)."], ["Per què el sud i el sud-est tenen més terratrèmols?", "Perquè són a prop del contacte entre la placa Euroasiàtica i l'Africana (microplaques Ibèrica i d'Alborán)."]] },

 { id: "s2", t: "t1", n: "1.2 Com es va formar el relleu", ps: [
  ["e", "<b>Era Primària o Paleozoica</b> (acaba fa uns 250 milions d'anys). Existia l'antiquíssim massís Galaic i la resta era aigua (mar de Tetis). L'<b>orogènia herciniana</b> va formar el <b>Massís Hespèric</b>, que ocupa la meitat occidental de la península i és de <b>roques silícies i metamòrfiques</b> (granit, pissarra). És el <b>sòcol</b> de la Meseta."],
  ["i", "<b>Era Secundària o Mesozoica</b> (acaba fa uns 65 milions d'anys). Va ser una època de calma: l'erosió va desgastar els relleus hercinians i els materials transportats es van dipositar al mar formant <b>roques calcàries</b>."],
  ["e", "<b>Era Terciària (Cenozoic)</b>: l'<b>orogènia alpina</b>. La pressió de les plaques va <b>plegar els materials tous</b> (els sediments) i <b>trencar els durs</b> (el sòcol hercinià, que és rígid). Així van néixer els <b>Pirineus</b>, les <b>Serralades Bètiques</b> i la part oriental de la <b>Serralada Cantàbrica</b>. A més, el sòcol de la Meseta es va fracturar en blocs: alguns es van aixecar (<b>Sistema Central</b>, <b>Monts de Toledo</b>) i les vores es van plegar (les <b>vores muntanyoses</b> de la Meseta)."],
  ["i", "<b>Període Quaternari</b> (des de fa uns 1,8 milions d'anys fins avui). Domina l'<b>erosió</b> dels relleus alpins. Els sediments van reomplir la <b>depressió de l'Ebre</b> (entre els Pirineus i el Sistema Ibèric) i la del <b>Guadalquivir</b> (entre Sierra Morena i les Bètiques), i es van formar les <b>planes litorals</b>."],
  ["n", "<b>Truc per recordar-ho:</b> herciniana = <i>fa</i> el sòcol; Mesozoic = el <i>desgasta</i>; alpina = el <i>trenca</i> i aixeca serralades; Quaternari = <i>omple</i> les depressions."]
 ], rq: [["Quina orogènia va formar el Massís Hespèric i de quines roques és?", "L'herciniana (Paleozoic). Roques silícies i metamòrfiques."], ["Per què l'orogènia alpina va plegar uns materials i en va trencar d'altres?", "Els materials tous (sediments) es pleguen; els durs i rígids (el sòcol) es fracturen en blocs."]] },

 { id: "s3", t: "t1", n: "1.3 Les unitats de relleu", map: "relief", ps: [
  ["e", "El relleu d'Espanya s'organitza en cinc grups: <b>la Meseta</b>, <b>les serralades exteriors</b> a la Meseta, <b>les dues grans depressions</b>, <b>els relleus litorals</b> i <b>el relleu insular</b>."],
  ["e", "<b>La Meseta</b> és la unitat principal (<b>45% de la superfície</b>). Es divideix en la <b>Submeseta Nord</b>, travessada pel Duero, i la <b>Submeseta Sud</b>, formada per dos altiplans (Tajo i Guadiana) separats pels Monts de Toledo."],
  ["e", "<b>Serralades interiors de la Meseta.</b> El <b>Sistema Central</b> la divideix pràcticament en dues meitats i té serres d'altitud important: Somosierra, Guadarrama, Gredos i Gata. Els <b>Monts de Toledo</b> divideixen la Submeseta Sud i fan de divisòria d'aigües entre el Tajo i el Guadiana; són serres d'alçada modesta, com la de Guadalupe."],
  ["e", "<b>Vores muntanyoses de la Meseta.</b> El <b>Massís Galaicoleonès</b> (Galícia, oest d'Astúries, Muntanyes de Lleó, serres de la Cabrera i Segundera) és un fragment del relleu més antic, paleozoic i molt erosionat. La <b>Serralada Cantàbrica</b> té una part occidental, el massís Asturià, elevada i trencada, i una part oriental, la Muntanya Cantàbrica, amb cims més baixos. El <b>Sistema Ibèric</b> té un sector nord (Moncayo, Pics d'Urbión), que separa la Meseta de la depressió de l'Ebre, i un sector sud de serres i depressions creuades per rius (Monts Universals, Conca, Albarracín, Javalambre, Gúdar i Maestrat). <b>Sierra Morena</b> és la vora meridional i separa la Meseta de la depressió del Guadalquivir."],
  ["e", "<b>Serralades exteriors.</b> Els <b>Pirineus</b>, d'uns 440 km, del golf de Biscaia al cap de Creus. Els <b>Prepirineus</b>, amb unes serralades interiors i unes exteriors i la depressió mitjana pirinenca entremig. Les <b>Serralades Litorals Catalanes</b>, dues rengleres paral·leles a la costa separades per una depressió. Les <b>Serralades Bètiques</b>: la <b>Penibètica</b>, amb Sierra Nevada i el <b>Mulhacén (3.481 m)</b>, i la <b>Subbètica</b>, amb les serres de Cazorla, Segura, Sagra i Mágina."],
  ["c", "<b>Compte:</b> el dossier dona 3.481 m al Mulhacén; altres fonts actuals (i el mapa de l'app) diuen 3.479 m. A l'examen, fes servir la xifra del professor."],
  ["c", "<b>Compte:</b> a la diapositiva d'Espanya, el Cadí surt com a Prepirineu <i>exterior</i> (amb el Montsec) i Guara i Peña com a interiors; però a la de Catalunya el Cadí surt com a Prepirineu <i>interior</i> (amb el Pedraforca) i els exteriors són el Montsec i el Montroig. La segona és la classificació habitual per a Catalunya. Pregunta-ho al professor si cau a l'examen."],
  ["e", "<b>Les dues depressions</b> es van formar amb els sediments de l'erosió dels relleus i dels rius. On els materials eren més durs van quedar <b>relleus tabulars</b>, i on eren més tous, <b>valls i terrasses</b>. La <b>depressió de l'Ebre</b> queda encaixada entre els Prepirineus, el Sistema Ibèric i les Serralades Litorals Catalanes. La <b>del Guadalquivir</b> s'estén entre Sierra Morena i les Serralades Bètiques."]
 ], rq: [["Quines serralades són interiors de la Meseta i quines en són les vores?", "Interiors: Sistema Central i Monts de Toledo. Vores: Massís Galaicoleonès, Cantàbrica, Sistema Ibèric i Sierra Morena."], ["Entre quines unitats hi ha la depressió del Guadalquivir?", "Entre Sierra Morena i les Serralades Bètiques."]] },

 { id: "s4", t: "t1", n: "1.4 Costes i relleu insular", map: "hidro", ps: [
  ["e", "<b>Costes atlàntiques.</b> La <b>cantàbrica</b> és alta i rectilínia: les muntanyes arriben al mar i formen penya-segats; hi ha poques platges i les ries són curtes i estretes. La <b>gallega</b> va de l'Estaca de Bares i el cap Ortegal fins a Portugal, i el seu tret més característic són les <b>ries</b>. L'<b>atlàntica andalusa</b> (golf de Cadis, de Portugal a Gibraltar) és <b>baixa i sorrenca</b>: els al·luvions dels rius han format planes costaneres on el vent aixeca dunes."],
  ["e", "<b>Costes mediterrànies.</b> La d'<b>Andalusia i Múrcia</b> (de l'estret de Gibraltar al cap de la Nau) és tallada, amb camps de dunes i albuferes com el <b>Mar Menor</b>. El <b>golf de València</b> (del cap de la Nau al delta de l'Ebre) és una gran plana litoral d'uns 400 km amb platges, aiguamolls, albuferes i tómbols (<b>penyal d'Ifac</b>, Calp). El <b>litoral català</b> no és uniforme: hi alternen deltes, petites planes i costes escarpades."],
  ["d", "<b>Tómbol:</b> relleu format per una fletxa o cordó litoral que uneix una illa al continent."],
  ["e", "<b>Arxipèlag balear.</b> Mallorca, Eivissa i Formentera són fragments emergits de la <b>Serralada Subbètica</b>, mentre que <b>Menorca</b> està relacionada amb la <b>Serralada Litoral Catalana</b>. Al nord de Mallorca hi ha la <b>Serra de Tramuntana</b> i a l'altra banda, la Serralada de Llevant. Eivissa i Formentera tenen relleu muntanyós i una gran plana; Menorca és plana."],
  ["e", "<b>Arxipèlag canari.</b> Són illes <b>volcàniques</b> amb un relleu molt complex: cons, calderes, barrancs, colades de lava i penya-segats. El <b>Teide (3.718 m)</b> és un volcà actiu i el cim més alt d'Espanya. Les illes més properes a Àfrica (<b>grup oriental: Lanzarote i Fuerteventura</b>) són força planes; les del <b>grup occidental</b> (Tenerife, La Palma, La Gomera, El Hierro i Gran Canària) són muntanyoses."],
  ["d", "Hi ha notícia històrica de gran activitat volcànica a Lanzarote al segle XVIII."]
 ], rq: [["Quina costa és baixa i sorrenca amb dunes?", "L'atlàntica andalusa (golf de Cadis)."], ["De quina serralada són fragments Mallorca, Eivissa i Formentera? I Menorca?", "De la Subbètica. Menorca, de la Serralada Litoral Catalana."]] },

 { id: "s5", t: "t1", n: "1.5 Els rius d'Espanya", map: "hidro", ps: [
  ["e", "<b>Vessant cantàbric:</b> rius <b>curts i cabalosos</b>, perquè neixen a la Serralada Cantàbrica, molt a prop del mar, i hi plou molt. Exemples: Bidasoa, Nervión, Nalón, Narcea i Navia."],
  ["e", "<b>Vessant atlàntic:</b> rius <b>llargs que pateixen estiatge a l'estiu</b>. Són llargs perquè la Meseta s'inclina cap a l'oest i recorren tota la península; a l'estiu baixen poc perquè plou poc. Exemples: Miño, Duero, Tajo, Guadiana, Guadalquivir, Odiel i Tinto."],
  ["e", "<b>Vessant mediterrani:</b> excepte l'<b>Ebre</b>, són rius de <b>poc cabal i molt irregulars</b>, amb crescudes fortes a la tardor. Exemples: Ebre, Xúquer, Ter, Llobregat, Túria, Millars, Segura, Almanzora i Guadalhorce."],
  ["i", "<b>Rius insulars.</b> A les <b>Balears</b> no hi ha cap curs d'aigua permanent, per les pluges escasses i perquè el terreny és permeable; només hi ha <b>torrents</b>, i a les desembocadures es formen albuferes o zones pantanoses (albufera d'Alcúdia). A les <b>Canàries</b> tampoc no hi ha xarxa fluvial; hi ha <b>barrancs</b>, talls al terreny fets per l'erosió que baixen de les muntanyes al mar i fan de llit de torrents. Hi ha pocs aqüífers, però s'ha pogut construir un embassament a Gran Canària (Soria)."],
  ["d", "<b>Estiatge:</b> disminució del cabal d'un riu en una època determinada de l'any. <b>Cabal:</b> quantitat de fluid que travessa una secció del llit per unitat de temps."]
 ], rq: [["Com són els rius de cada vessant?", "Cantàbric: curts i cabalosos. Atlàntic: llargs amb estiatge d'estiu. Mediterrani: poc cabal i irregulars (excepte l'Ebre)."], ["Quina diferència hi ha entre un riu i un barranc?", "El riu porta aigua tot l'any; el barranc és un tall al terreny que només porta aigua quan plou."]] },

 { id: "s6", t: "t1", n: "1.6 El clima: conceptes i factors", ps: [
  ["e", "El <b>temps</b> són les condicions de l'atmosfera (temperatura, pressió, vent, núvols, precipitacions) en un lloc i un moment determinats. El <b>clima</b> són les condicions mitjanes d'un lloc, és a dir, la repetició anual dels tipus de temps."],
  ["e", "<b>La temperatura.</b> Mesura l'energia de les molècules de l'aire, que ve de la radiació solar. Hi influeixen el <b>gradient vertical de temperatura</b> (de mitjana baixa <b>0,65 °C cada 100 m</b> que pugem), el <b>repartiment de terres i mars</b> (els oceans s'escalfen i es refreden més a poc a poc que els continents), els corrents marins, el dia i la nit, els vents i l'orientació (solana i obaga)."],
  ["e", "<b>La humitat.</b> L'aire conté vapor d'aigua, i com més calent és, més en pot contenir. La <b>humitat absoluta</b> (g/m³) és la quantitat de vapor en un lloc i moment. La <b>relativa</b> (%) és la relació entre el vapor que hi ha i el màxim que hi podria haver; al 100% l'aire està <b>saturat</b> i el vapor es condensa."],
  ["e", "<b>Les precipitacions.</b> Són la caiguda d'aigua líquida (pluja) o sòlida (neu, calamarsa) quan el vapor es refreda i es condensa. Es mesuren amb el <b>pluviòmetre</b> i les línies que uneixen punts d'igual precipitació són les <b>isohietes</b>. Hi ha tres règims: <b>equatorial</b> (pluges diàries), <b>tropical</b> (estació seca i humida) i <b>temperat</b> (pluges irregulars tot l'any), que és el de la península."],
  ["i", "<b>La pressió atmosfèrica</b> és el pes de l'aire per unitat de superfície; les línies d'igual pressió són les <b>isobares</b>. Les diferències de pressió les causa la temperatura. <b>Els vents</b> són moviments d'aire a gran escala: els <b>alisis</b> bufen del tròpic cap a l'equador i els <b>monsons</b> donen estius plujosos i hiverns eixuts al sud-est asiàtic."],
  ["c", "<b>Compte:</b> la diapositiva diu que l'aire calent «dona més estabilitat» i el fred «més inestabilitat». En general és al revés: l'aire calent puja, fa baixes pressions i porta inestabilitat (núvols i pluja); l'aire fred baixa, fa altes pressions (anticicló) i porta estabilitat. Comenta-ho amb el professor."],
  ["e", "<b>Situació d'Espanya.</b> És a la <b>zona temperada</b>, on arriben masses d'aire <b>tropicals</b> (marítimes, com l'<b>anticicló de les Açores</b>, i càlides i seques del nord d'Àfrica) i <b>polars</b> (continentals siberianes i de l'Àrtic). Les zones amb més influència del mar tenen més pluja i temperatures suaus; les continentals tenen més <b>oscil·lació tèrmica</b>. Estar entre l'Atlàntic, el Mediterrani, Àfrica i Europa és un factor clau del clima."],
  ["i", "La <b>gota freda</b> és una pertorbació atmosfèrica extratropical no frontal que pot provocar pluges violentes i intenses durant hores o dies, amb llamps i calamarsa. El <b>corrent en jet</b> (<i>jet stream</i>) és un corrent d'aire molt ràpid (60-550 km/h) prop de la tropopausa que envolta la Terra i separa les altes pressions tropicals de les baixes pressions polars."]
 ], rq: [["Quina diferència hi ha entre temps i clima?", "Temps: condicions en un lloc i moment concrets. Clima: condicions mitjanes, la repetició anual dels tipus de temps."], ["Què vol dir que la humitat relativa és del 100%?", "Que l'aire està saturat: no pot contenir més vapor i es condensa."]] },

 { id: "s7", t: "t1", n: "1.7 Els climes i la vegetació d'Espanya", ps: [
  ["e", "<b>Clima oceànic o atlàntic</b> (Galícia i cornisa cantàbrica). Influït per les masses d'aire de l'Atlàntic: hiverns suaus, estius moderats, mitjana d'uns <b>14 °C</b>, <b>poca amplitud tèrmica</b>, molta humitat i <b>pluja abundant tot l'any</b>. <b>Vegetació:</b> bosc temperat <b>caducifoli</b>, sobretot <b>rouredes i fagedes</b>, i també castanyers, bedolls, aurons i til·lers. Quan el bosc es degrada apareix la <b>landa</b> (brucs i falgueres). L'acció humana l'ha substituït en molts llocs per <b>pins i eucaliptus</b>, i al fons de les valls hi ha prats humits per al bestiar."],
  ["c", "<b>Compte:</b> la diapositiva posa «100-2500 mm» de pluja al clima oceànic; segurament vol dir <b>1.000-2.500 mm</b>."],
  ["e", "<b>Clima mediterrani.</b> Temperat, amb mitjanes de <b>14-18 °C</b>: hiverns suaus (10-12 °C) i estius càlids (22-26 °C). Les pluges són <b>equinoccials</b> (primavera i tardor) i fan <b>400-700 mm</b>, més al nord i a la muntanya. Té variants: típic (Palma), de pluges més abundants (Girona) i sec del sud-est (Almeria). <b>Vegetació:</b> baixa, de fulla petita i <b>perenne</b>: <b>alzina</b>, roure garriguer, pi negre i <b>pi blanc</b>; a Catalunya i el sud d'Andalusia, <b>alzina surera</b>. On l'home ha destruït el bosc hi ha <b>garrigues</b> (garric, estepes, bruc). Al sud-est, àrid, hi ha espart, <b>margalló</b> i farigola. L'home hi ha creat olivars (Guadalquivir), ametllers, figueres, cítrics i palmeres."],
  ["e", "<b>Clima continental o d'interior</b> (interior de la península). <b>Hiverns molt freds</b> amb boires freqüents, <b>estius molt calorosos i secs</b>, pluges escasses (<b>325-550 mm</b>) i <b>amplitud tèrmica molt elevada</b>, perquè queda lluny del mar. <b>Vegetació:</b> reduïda per la fusta, l'agricultura i el pasturatge; hi ha guarets i matolls esteparis. És <b>xeròfil·la</b> (arrels profundes per resistir la sequera i el fred). L'arbre més freqüent és l'<b>alzina</b>, que forma <b>deveses</b>; a la muntanya hi ha roures i pinars, i als rius, <b>bosc de ribera</b> (oms, salzes i freixes). Si es perd el bosc apareix la <b>màquia</b> (sòls silicis: arboç, bruc, boix) o la <b>garriga</b> (sòls calcaris: garric, llentiscle, ullastre i aromàtiques com romaní, farigola i espígol)."],
  ["e", "<b>Clima subtropical</b> (Canàries). Influït per l'Atlàntic, per Àfrica i pel <b>corrent fred de les Canàries</b>, que suavitza les temperatures. Pluges escasses (<b>150-300 mm</b>) concentrades a l'hivern; Lanzarote i Fuerteventura tenen trets desèrtics per la proximitat al Sàhara. <b>Vegetació:</b> estepària, amb espècies autòctones com el <b>drago</b> i els boscos de <b>laurisilva</b>. Els alisis carregats d'humitat formen un <b>mar de núvols</b> als vessants de sobrevent que deixa <b>precipitacions horitzontals</b>; per sobre dels núvols l'aire és sec i hi ha <b>inversió tèrmica</b>."],
  ["e", "<b>Clima de muntanya.</b> Varia segons l'alçada i l'<b>efecte Foehn</b>, i se suma al clima de cada zona. <b>Oceànica</b> (Cantàbrica i Pirineus): molta pluja (1.700 mm al Cantàbric, 1.200 als Pirineus), uns 5 °C i neu fins a 9 mesos. <b>Mediterrània</b> (relleus costaners): 600-800 mm, estius frescos i hiverns suaus. <b>Interior</b> (Sistema Ibèric, Central i Monts de Toledo): hiverns llargs i molt freds, estius curts i frescos, 400-1.000 mm."],
  ["e", "<b>L'efecte Foehn.</b> Quan una muntanya talla el pas del vent, l'aire ha de pujar. Pel vessant de <b>barlovent</b> es refreda (1 °C cada 100 m mentre és sec), el vapor es condensa i plou; a partir d'aquí es refreda més a poc a poc (0,6 °C cada 100 m). Quan baixa pel vessant de <b>sotavent</b>, ja sense humitat, s'escalfa 1 °C cada 100 m i arriba a baix <b>sec i més calent</b> que quan va començar. Prova-ho al simulador de la pestanya Activitats."]
 ], rq: [["Quina vegetació és pròpia del clima oceànic? I què apareix quan es degrada?", "Bosc caducifoli (rouredes i fagedes). La landa (brucs i falgueres)."], ["Diferència entre màquia i garriga?", "Màquia: sòls silicis (arboç, bruc, boix). Garriga: sòls calcaris (garric, llentiscle, ullastre)."]] },

 /* ---------------- TEMA 2 ---------------- */
 { id: "s8", t: "t2", n: "2.1 El relleu de Catalunya", map: "com", ps: [
  ["e", "De manera simplificada, Catalunya té <b>quatre grans unitats</b>: (1) els <b>Pirineus</b> (Axial i Prepirineu), (2) les <b>Serralades Litorals catalanes</b>, (3) la <b>Depressió Central</b> i (4) la <b>costa amb les planes litorals</b>. Té un relleu trencat i muntanyós i dues grans planes: la de l'<b>Empordà</b>, que desguassa al mar, i la d'<b>Urgell</b>, que desguassa cap a l'Ebre."],
  ["d", "Segons el dossier, Catalunya ocupa 31.896 km², i només 6.435 km² no passen dels 200 m d'altitud."],
  ["e", "<b>Els Pirineus.</b> El <b>Pirineu axial</b> s'aixeca per sobre dels 3.000 m; hi ha el cim més alt de Catalunya, la <b>Pica d'Estats (3.143 m)</b>. El <b>Prepirineu</b> té unes serralades <b>interiors</b> (Cadí, Pedraforca, Bassagoda) i unes <b>exteriors</b> (Montsec i Montroig), separades per depressions mitjanes com la <b>Conca de Tremp</b>. La <b>Serralada Transversal</b>, al peu dels Pirineus, uneix el Prepirineu amb les serralades litorals; hi destaca el <b>Puigsacalm</b>."],
  ["e", "<b>Serralades litorals.</b> La <b>Serralada Prelitoral</b> (interior) va dels Pirineus a l'Ebre i hi destaquen <b>Montserrat</b> i el <b>Montseny</b>. La <b>Serralada Litoral o de Marina</b> és davant la costa (Barcelona, Maresme), amb el <b>Montnegre (759 m)</b>."],
  ["c", "<b>Compte:</b> el dossier dona 1.747 m al Montseny. El cim més alt del Montseny, el Turó de l'Home, fa uns 1.706 m. Revisa-ho amb el professor."],
  ["e", "<b>Les depressions.</b> La <b>Depressió Central</b> (part de la de l'Ebre) s'estén entre el Prepirineu i la Serralada Prelitoral, amb unitats com la <b>Plana de Vic</b>, el pla de <b>Manresa</b>, la <b>Conca d'Òdena</b> o la de <b>Barberà</b>, que alternen amb altiplans (<b>la Segarra</b>). La <b>Depressió Prelitoral</b> és entre la Serralada Litoral i la Prelitoral, i la <b>Depressió Litoral</b>, entre la Serralada de Marina i la costa."],
  ["a", "<b>Per ampliar:</b> les principals planes de la Depressió Prelitoral són el Vallès i el Penedès."],
  ["e", "<b>Les costes.</b> Hi ha <b>costes altes</b>, on les serralades arriben al mar (<b>Costa Brava</b>), i <b>costes baixes</b>, amb platges llargues de sorra fina (Tarragonès)."]
 ], rq: [["Quines són les quatre grans unitats de relleu de Catalunya?", "Pirineus (Axial i Prepirineu), Serralades Litorals, Depressió Central i la costa amb les planes litorals."], ["Què uneix la Serralada Transversal?", "El Prepirineu amb les serralades litorals."]] },

 { id: "s9", t: "t2", n: "2.2 Les regions fisiogràfiques", ps: [
  ["e", "Catalunya es divideix en dues grans zones segons la pluja. La <b>Catalunya seca</b> rep <b>menys de 700 mm</b> l'any, té estius secs i calorosos i hiverns secs i temperats, i una vegetació mediterrània perennifòlia adaptada a la sequera (alzinars). La <b>Catalunya humida</b> rep <b>més de 700 mm</b>, hi ha les principals reserves d'aigua del país i la vegetació és caducifòlia (rouredes, fagedes) i de coníferes (avets i pi negre)."],
  ["e", "<b>Regions de la Catalunya seca:</b><br>• <b>Tramuntana</b> (Rosselló i Empordà, de les Alberes a les Gavarres): pi blanc i boscos mixtos de pi i alzina surera.<br>• <b>Litoral mediterrani</b> (serralades i depressions litorals, de les Gavarres a la Sénia): més calorós i sec cap al sud; pi blanc i boscos d'alzina i pi. És la <b>regió més poblada</b>.<br>• <b>Altiplà central</b> (Depressió Central entre la Prelitoral i el Prepirineu): més oscil·lació tèrmica i menys pluja que al litoral; pinedes de pi blanc i matollars; pobles a la vora dels rius.<br>• <b>Prepirineu</b>: hivern fred i estiu calorós; pi blanc, roures i alzines, i als vessants humits roure, faig i pi negre; pobles a les valls.<br>• <b>Continental</b> (terres més interiors i planes, fetes de sediments dels rius): clima extremat i pluja escassa (<b>300-450 mm</b>); vegetació <b>estepària</b> adaptada a sòls salins; pobles a les vores dels rius i a les terrasses fluvials."],
  ["e", "<b>Regions de la Catalunya humida:</b><br>• <b>Regió oriental</b> (Serralada Transversal, entre el Pirineu i la Serralada Litoral): és la «<b>dorsal pluviomètrica de Catalunya</b>» (800-1.800 mm), sense cap mes sec. Rouredes, castanyedes, fagedes i alzinars; poblament força dispers.<br>• <b>Alt Pirineu</b> (muntanyes de més de 2.000 m): paisatge alpí i subalpí, clima fred i humit (1.000-2.000 mm). Caducifolis (rouredes, fagedes) amb perennifolis (pi negre, avetoses) i prats. És la <b>regió menys poblada</b>."],
  ["i", "<b>El matollar</b> és la vegetació arbustiva que surt on s'ha perdut el bosc, en condicions seques. N'hi ha dos tipus: la <b>màquia</b> (oliveres silvestres, garric, llentiscle, estepa, bruc i ginesta) i la <b>garriga</b> (garric, marfull, farigola, romaní i espígol)."],
  ["d", "<b>Terrassa fluvial:</b> esglaó pla al costat d'un riu, fet de sediments que el riu va deixar quan baixava més alt. <b>Vegetació estepària:</b> herbes i matolls baixos adaptats a la sequera i als sòls pobres o salins."]
 ], rq: [["Quin és el límit de pluja entre la Catalunya seca i la humida?", "700 mm l'any."], ["Quina regió és la dorsal pluviomètrica i quina és la menys poblada?", "La regió oriental (Serralada Transversal). L'Alt Pirineu."]] },

 { id: "s10", t: "t2", n: "2.3 La xarxa hidrogràfica i Köppen", map: "hidro", ps: [
  ["e", "Els rius catalans s'agrupen en <b>quatre vessants</b>:<br>1. <b>Xarxa Pirineu-Ebre</b>: neixen al Pirineu axial i desemboquen a l'Ebre. Són molt cabalosos a la <b>primavera pel desgel</b>. El <b>Segre</b> i els seus afluents: Valira, Noguera Pallaresa, Noguera Ribagorçana, Cinca, Set, Corb, Boix, Aravó i Llobregós.<br>2. <b>Xarxa Pirineu-Mediterrani</b>: neixen als Pirineus o Prepirineus i van al Mediterrani; cabalosos però amb estiatge. Muga, Fluvià, <b>Ter</b> (amb el Freser i l'Onyar), <b>Llobregat</b> (amb el Cardener i l'Anoia) i Foix.<br>3. <b>Xarxa Mediterrània</b>: neixen a les serralades Prelitoral i Litoral. Tordera, Besòs, Gaià, Francolí, Sénia i Riudecanyes.<br>4. <b>Xarxa Atlàntica</b>: neix a la Vall d'Aran i va a l'Atlàntic: la <b>Garona</b>."],
  ["i", "<b>La classificació de Köppen</b> combina les mitjanes de temperatura i de precipitació i l'estacionalitat de la pluja. Té <b>5 grups</b> (majúscules): <b>A</b> tropical, <b>B</b> sec (àrid i semiàrid), <b>C</b> temperat, <b>D</b> continental i <b>E</b> polar. Les minúscules indiquen el patró de la pluja i altres trets (per exemple, <i>s</i> = estiu sec, <i>w</i> = hivern sec, <i>f</i> = sense estació seca)."],
  ["a", "<b>Per ampliar:</b> a Espanya predominen el <b>Csa</b> (mediterrani d'estiu calorós) i el <b>Csb</b> (d'estiu temperat), el <b>Cfb</b> (oceànic) al nord, i el <b>BSk/BSh</b> (semiàrid) al sud-est i a la vall de l'Ebre."]
 ], rq: [["Per què els rius de la xarxa Pirineu-Ebre són cabalosos a la primavera?", "Perquè porten l'aigua del desgel."], ["Quin riu català va a l'Atlàntic?", "La Garona, que neix a la Vall d'Aran."]] },

 /* ---------------- TEMA 3 ---------------- */
 { id: "s11", t: "t3", n: "3.1 Què és un recurs i com es classifica", ps: [
  ["e", "Un <b>recurs natural</b> és un bé de la natura que pot tenir algun interès per a l'ésser humà. Es pot classificar de moltes maneres: segons el <b>temps de regeneració</b> (renovables i no renovables), segons si són <b>energètics o no</b>, segons l'<b>impacte</b> (nets o bruts), segons l'<b>aprofitament</b> (primaris o finals) i segons el <b>temps que fa que l'home els utilitza</b> (convencionals o alternatius)."],
  ["e", "Els <b>renovables</b> es regeneren de manera natural a un ritme <b>igual o superior</b> al ritme en què els explotem, a través de cicles naturals: el vent (eòlica), el sol (solar) o l'aigua (hidràulica). Els <b>no renovables</b> s'exhaureixen amb l'ús perquè es regeneren més a poc a poc del que els consumim: carbó, petroli, gas natural, urani, bauxita, mercuri, zinc, coure, potassa, fosfats, diamants, sofre..."],
  ["e", "<b>No energètics:</b> <b>abiòtics</b> (l'aigua i l'aire net), <b>edafològics</b> (els sòls), <b>biològics</b> (agraris, pesquers, ramaders) i <b>paisatgístics</b>. <b>Energètics:</b> combustibles fòssils (carbó, gas natural, petroli), minerals radioactius, i les energies hidràulica, mareomotriu, geotèrmica, solar i eòlica."],
  ["i", "Segons l'aprofitament, l'<b>energia primària</b> és la que es fa servir tal com és a la natura, sense conversió (per exemple, la solar), i l'<b>energia final</b> és la que arriba a l'usuari (per exemple, l'electricitat de casa). Els <b>combustibles fòssils</b> s'han originat per la fossilització de matèria orgànica."]
 ], rq: [["Per què el carbó és no renovable i el vent sí?", "El carbó es regenera molt més a poc a poc del que el consumim; el vent es renova contínuament per cicles naturals."], ["Què és un recurs edafològic?", "El sòl."]] },

 { id: "s12", t: "t3", n: "3.2 Els recursos miners", ps: [
  ["e", "Els recursos miners es classifiquen en: <b>minerals metàl·lics</b> (ferro, pirita, plom, zinc, coure, mercuri, tungstè, estany), que s'utilitzen en la metal·lúrgia, la química i la indústria; <b>minerals no metàl·lics</b> (sals potàssiques, sal comuna, argiles, quars, feldspat, magnesita, fluor, fosfats); <b>roques industrials</b> (calcàries, pissarres, granit, marbre, guix); i <b>minerals energètics</b> (carbó i urani)."],
  ["e", "<b>Catalunya</b> és força pobra en recursos miners. El principal no energètic és la <b>sal potàssica del Bages</b>. Dels energètics, hi ha <b>carbó als Pirineus</b> (Berguedà, Alta Ribagorça, Pallars Jussà) i una mica de <b>petroli a Tarragona</b>, amb una producció molt baixa."],
  ["e", "<b>Espanya</b> té recursos variats, però només destaca en <b>roques i minerals industrials</b>. Metàl·lics: ferro, coure, plom i cassiterita (estany). Energètics: carbó (Astúries, Cantàbrica, Lleó i Terol), petroli de Tarragona i gas natural (Osca i plataformes de Biscaia i Cadis). Roques i minerals industrials: <b>pissarra, marbre i granit</b> (Espanya és dels primers exportadors del món), celestina, potassa, fluorita, guix, feldspat i <b>sepiolita, de la qual té el 70% de les reserves mundials</b>."],
  ["d", "<b>Sepiolita:</b> silicat hidratat de magnesi (morter i ciment). <b>Celestina:</b> sulfat d'estronci (focs d'artifici, refinatge del sucre de remolatxa)."]
 ], rq: [["Quin és el principal recurs miner no energètic de Catalunya?", "La sal potàssica del Bages."], ["De quin mineral té Espanya el 70% de les reserves mundials?", "De la sepiolita."]] },

 { id: "s13", t: "t3", n: "3.3 Els recursos hídrics", map: "hidro", ps: [
  ["e", "L'aigua és un recurs imprescindible. Les <b>reserves hídriques</b> són la quantitat d'aigua dolça aprofitable. La quantitat d'aigua del planeta és <b>constant</b>; el que canvia és el seu estat segons el <b>cicle hidrològic</b>. Hi ha <b>aigües oceàniques</b> (98%) i <b>aigües continentals</b>, superficials i subterrànies (només el 2%)."],
  ["e", "<b>Usos de l'aigua:</b> <b>75% agricultura</b>, 12% habitatges, 10% indústria i 3% serveis. <b>Tècniques per tractar-la:</b> la <b>potabilització</b> (fer-la apta per beure), la <b>dessalinització</b> (treure-li la sal; la primera planta va ser a Lanzarote i la més important de Catalunya és la del Prat de Llobregat) i la <b>depuració</b> (netejar l'aigua residual per reutilitzar-la en agricultura, neteja o reg)."],
  ["e", "<b>Els rius.</b> La <b>conca</b> és el territori regat per un riu principal i els seus afluents. És <b>exorreica</b> si desguassa en un oceà o mar obert i <b>endorreica</b> si desguassa en un mar interior, llac o llacuna. Segons d'on ve l'aigua, el <b>règim fluvial</b> pot ser: <b>nival</b> (alta muntanya; màxim a l'estiu pel desgel i mínim a l'hivern: Segre, Guadix, Dílar), <b>nivopluvial</b> (neu i pluja: Ter, Gállego, Nalón), <b>pluvionival</b> (sobretot pluja i una mica de desgel: Henares, Alagón, Tormes, Pisuerga) i <b>pluvial</b> (només pluja, mínim a l'estiu; el de la majoria: Francolí, Segura, Besòs)."],
  ["i", "Les <b>crescudes</b> són els moments de màxim cabal, que poden fer desbordar el riu. Els <b>arrossegaments</b> són els materials erosionats per la pluja que van a parar al riu."],
  ["e", "<b>Altres masses d'aigua.</b> <b>Llacs i llacunes</b>: aigua dolça en depressions del terreny formades per falles, volcans o l'acció de l'aigua (llac de Sanabria, llacunes de Ruidera). <b>Albuferes</b>: badies marines (salades) tancades per una barra de sorra (albufera d'Alcúdia). <b>Delta</b>: terra de forma triangular feta pels al·luvions d'un riu a la desembocadura (delta de l'Ebre). <b>Aiguamolls</b>: terrenys inundats (aiguamolls de l'Empordà)."],
  ["e", "<b>Embassaments i aqüífers.</b> Un <b>embassament</b> és aigua emmagatzemada artificialment amb una presa. N'hi ha <b>més de 1.000</b> a Espanya i serveixen per produir electricitat, regar, proveir d'aigua i, sobretot, <b>regular cabals</b>. Alguns d'importants: <b>Alcántara</b> (Tajo), <b>La Serena</b> (Guadiana), <b>El Tranco</b> (Guadalquivir), <b>Tous</b> (Xúquer); a Catalunya, <b>Mequinensa</b> (Ebre) i <b>Sau</b> (Ter). Els <b>aqüífers</b> són bosses d'aigua a l'interior de les roques; n'hi ha <b>més de 350</b> i els més explotats són els del Xúquer i el Guadiana."],
  ["e", "<b>La gestió a Espanya.</b> L'Estat va dividir el territori en <b>14 demarcacions hidrogràfiques</b>: zones terrestres i marítimes amb una o més conques veïnes i les seves aigües subterrànies i costaneres (Galícia-Costa, Miño-Limia, Cantàbric, Conques internes del País Basc, Duero, Tajo, Guadiana, Guadalquivir, Conques atlàntiques d'Andalusia, Conques mediterrànies d'Andalusia, Segura, Xúquer, Ebre i Conques internes de Catalunya)."],
  ["e", "<b>Els transvasaments.</b> Per compensar la distribució desigual de l'aigua s'han fet transvasaments; ciutats com Barcelona, Madrid, València o Múrcia en depenen. Però alteren aqüífers, cabals, fauna i flora, i per això són <b>molt controvertits</b>, com el del <b>Pla Hidrològic Nacional de 2005</b> (transvasament de l'Ebre) o el pla de 2016, que preveia més de 465.000 ha noves de regadiu."],
  ["e", "<b>La gestió a Catalunya.</b> Hi ha dues vessants. La <b>occidental</b> o <b>conques intercomunitàries</b> (Ebre, Garona i Xúquer), un <b>49%</b> del territori, es gestiona amb la <b>Confederació Hidrogràfica de l'Ebre</b> i la del Xúquer. La <b>oriental</b> o <b>conques internes</b> (Nord: Muga, Fluvià, Ter, Daró, Tordera; Centre: Besòs, Llobregat, Foix; Sud: Francolí, Gaià; i les rieres del Baix Ebre i el Montsià) és competència exclusiva de la Generalitat (<b>Llei 6/1999</b>) i la gestiona l'<b>Agència Catalana de l'Aigua (ACA)</b>."],
  ["i", "A banda de canals com el d'<b>Urgell</b>, hi ha preses i embassaments a cada xarxa: Pirineu-Ebre (Riba-roja, Flix, Mequinensa, Oliana, Rialb, Talarn/Sant Antoni, Camarasa, Escales, Canelles...), Pirineu-Mediterrani (<b>la Baells</b>, Sant Ponç i la Llosa del Cavall al Llobregat; el Foix; Boadella, <b>Sau i Susqueda</b> al Ter), Mediterrània (Santa Fe a la Tordera, Vallforners al Besòs, el Catllar al Gaià, Riudecanyes) i Atlàntica (llacs de la Vall d'Aran, com la Restanca)."]
 ], rq: [["Quins són els quatre règims fluvials, de més a menys influència de la neu?", "Nival, nivopluvial, pluvionival i pluvial."], ["Qui gestiona les conques internes de Catalunya i per quina llei?", "L'Agència Catalana de l'Aigua (ACA), per la Llei 6/1999."]] },

 { id: "s14", t: "t3", n: "3.4 Els recursos forestals", ps: [
  ["e", "Els boscos han estat importants per obtenir <b>fusta</b> per a la construcció, la indústria naval, els mobles i les eines agrícoles, i <b>llenya</b> com a font d'energia. A més, són la llar de la <b>biodiversitat</b> i <b>fixen el CO₂</b> de l'atmosfera: a Espanya, els 18,6 milions d'hectàrees de bosc fixen el <b>20% de les emissions de CO₂</b>."],
  ["e", "<b>La legislació espanyola</b> ha canviat de mirada amb el temps:<br>• <b>1916, Llei de Parcs Nacionals</b>: els parcs només tenen un valor <b>estètic, paisatgístic i de lleure</b>.<br>• <b>1957, Llei de Montes</b>: posa l'accent en l'<b>aprofitament econòmic</b>.<br>• <b>1989, Llei de Conservació dels Espais Naturals i de la Flora i la Fauna Silvestres</b>: defineix els espais protegits i el seu ús.<br>• <b>2007, Llei del Patrimoni Natural i de la Biodiversitat</b>: la vigent."],
  ["e", "<b>Figures de protecció de la llei de 2007:</b><br>• <b>Parcs</b>: es limita l'aprofitament i l'entrada de visitants. <b>Nacionals</b>, de valor científic, paisatgístic i educatiu, preservats de qualsevol intervenció (Picos de Europa, Ordesa i Mont Perdut, <b>Aigüestortes i Estany de Sant Maurici</b>). <b>Naturals</b>, amb un ús controlat dels recursos (<b>Delta de l'Ebre</b>, Cap de Creus, Montserrat, Montseny).<br>• <b>Àrees marines protegides</b>: defensen els ecosistemes marins.<br>• <b>Reserves naturals</b>: protegeixen ecosistemes (Delta del Llobregat, <b>Illes Medes</b>).<br>• <b>Monuments naturals</b>: espais singulars, rars o bells.<br>• <b>Paisatges protegits</b>: es protegeix el valor estètic o cultural."],
  ["c", "<b>Compte:</b> la diapositiva diu que la llei de 2007 té «quatre figures», però en llista cinc (parcs, àrees marines, reserves, monuments i paisatges). Aprèn-te les cinc."],
  ["e", "<b>Legislació catalana</b>, que s'hi afegeix: el <b>PEIN</b> (Pla d'Espais d'Interès Natural), creat el <b>1985</b> per fer una xarxa d'espais protegits a tot el territori, amb <b>144 espais</b>; i els <b>PNIN</b> (Paratges Naturals d'Interès Nacional), com parcs nacionals però més petits i <b>només a Catalunya</b> (Pedraforca, Poblet)."],
  ["d", "Exemples de les imatges del dossier: Parc Natural de Montserrat, Parc Nacional d'Aigüestortes, Paratge Natural del Pedraforca i Reserva Natural dels Aiguamolls de l'Empordà."]
 ], rq: [["Quina és la llei vigent i quines figures té?", "Llei del Patrimoni Natural i de la Biodiversitat (2007): parcs (nacionals i naturals), àrees marines protegides, reserves naturals, monuments naturals i paisatges protegits."], ["Què és un PNIN?", "Un Paratge Natural d'Interès Nacional: com un parc nacional però més petit, només a Catalunya (Pedraforca, Poblet)."]] }
];

          if (!good) this.classList.add("bad");
          card.appendChild(h("div", { "class": "fb " + (good ? "ok" : "bad") }, [h("b", { text: good ? "Correcte" : "Resposta correcta: " + x.o[0] }), x.e ? h("span", { text: x.e }) : null]));
          var nx = btn(i + 1 < list.length ? "Següent" : "Veure resultat", function () { i++; show(); });
          card.appendChild(h("div", { "class": "btns" }, [nx, h("button", { type: "button", "class": "btn ghost", text: "Llegir l'apartat", onclick: function () { S.ft = x.t; tab("exp", x.s); } })]));
          nx.focus();
        } }));
      });
      card.appendChild(opts); zone.appendChild(card);
    }
    function end() {
      var ok = res.filter(function (r) { return r[1]; }).length;
      var per = {}; res.forEach(function (r) { var t = r[0].t; per[t] = per[t] || [0, 0]; per[t][1]++; if (r[1]) per[t][0]++; });
      Object.keys(per).forEach(function (t) { S.res[t] = per[t]; }); save();
      var card = h("section", { "class": "card" }, [h("h3", { text: "Resultat" }), h("div", { "class": "score", text: ok + "/" + res.length })]);
      var tbl = h("div", { "class": "res-t" });
      Object.keys(per).sort().forEach(function (t) { var pc = Math.round(100 * per[t][0] / per[t][1]); tbl.appendChild(h("div", {}, [tag(t), " " + TB[t].t])); tbl.appendChild(h("div", { "class": "prog", style: "min-width:150px" }, [h("div", { "class": "bar" }, [h("i", { style: "width:" + pc + "%" })]), h("span", { text: per[t][0] + "/" + per[t][1] })])); });
      card.appendChild(tbl);
      var bad = res.filter(function (r) { return !r[1]; });
      if (bad.length) { card.appendChild(h("h4", { text: "Les que has fallat" })); card.appendChild(h("ul", { "class": "miss" }, bad.map(function (r) { return h("li", { style: "display:block" }, [h("b", { text: r[0].q }), h("br"), h("span", { "class": "muted", text: "→ " + r[0].o[0] })]); }))); }
      card.appendChild(h("div", { "class": "btns" }, [bad.length ? btn("Repetir les fallades", function () { run(bad.map(function (r) { return r[0]; })); }) : null, btn("Nou test", function () { tab("test"); }, !!bad.length)]));
      zone.appendChild(card);
    }
    show();
  }

  /* ---------- GLOSSARI ---------- */
  R.glos = function () {
    var ft = S.gft || "all", qv = "";
    var list = h("dl", { "class": "gl-l" }), count = h("span", { "class": "muted" });
    function draw() {
      list.textContent = ""; var n = 0, norm = function (s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }, qq = norm(qv);
      GLOS.slice().sort(function (a, b) { return a[1].localeCompare(b[1], "ca"); }).forEach(function (g) {
        if (ft !== "all" && g[0] !== ft) return; if (qq && norm(g[1] + " " + g[2]).indexOf(qq) < 0) return; n++;
        list.appendChild(h("div", {}, [h("dt", { text: g[1] }), h("dd", { text: g[2] })]));
      });
      count.textContent = n + " termes";
    }
    var c = h("section", { "class": "card" }, [h("h3", { text: "Glossari" }), h("input", { "class": "search", type: "search", placeholder: "Cerca un concepte…", "aria-label": "Cerca", oninput: function () { qv = this.value; draw(); } }), h("div", { "class": "row" }, [temaSeg(ft, function (v) { S.gft = v; save(); tab("glos"); }), count]), list]);
    body.appendChild(c); draw();
  };

  /* ---------- Arrencada ---------- */
  body = $("sbody");
  document.querySelectorAll("#sec button").forEach(function (b) { b.addEventListener("click", function () { setSec(b.getAttribute("data-s")); }); });
  document.querySelectorAll("#stabs button").forEach(function (b) { b.addEventListener("click", function () { tab(b.getAttribute("data-t")); window.scrollTo(0, 0); }); });
  if (!R[S.tab]) S.tab = "pla";
  setSec(S.sec);
  window.__temari = { S: S, tab: tab, setSec: setSec };
})();
